<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Mania</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://kit.fontawesome.com/b6f51a36c5.js" crossorigin="anonymous"></script>
</head>

<body id="movies__body">
  <section>
    <nav>
      <div class="nav__container">
        <img class="logo" src="assets/movie-mania-logo.jpg" alt="Movie Mania Logo">
        <ul class="nav__links">
          <li><a href="#" class="nav__link">Home</a></li>
          <li><a href="#" class="nav__link">About</a></li>
          <li><a href="#" class="nav__link nav__link--primary">Movies</a></li>
          <li><a href="#" class="nav__link">Contact</a></li>
        </ul>
        <button class="btn__menu" onclick="openMenu()">
          <i class="fa-solid fa-bars-staggered"></i>
        </button>
        <div class="menu__backdrop" style="visibility: hidden;">
          <button class="btn__menu btn__menu--close" onclick="closeMenu()">
            <i class="fa-regular fa-circle-xmark"></i>
          </button>
          <ul class="menu__links">
            <li class="menu__list">
              <a href="#" class="menu__link" onclick="closeMenu()">Home</a>
            </li>
            <li class="menu__list">
              <a href="#features" class="menu__link" onclick="closeMenu()">Movies</a>
            </li>
            <li class="menu__list">
              <a class="menu__link no-cursor" onclick="closeMenu()">Contacts</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </section>

  <main id="movies__main">
    <section>
      <div class="container">
        <div class="row">
          <div class="movies__header">
            <h2 class="section__title movies__header--title">
              All <span class="blue">Movies</span>
            </h2>
            <form class="search-container" action="/search" method="GET">
              <input type="search" name="input" class="search-movies" placeholder="Search for a movie..." required />
              <button type="button" onclick="loadMovieCards()" class="search-button">Search</button>
            </form>
            <select id="filter" onchange="filterMovies(event)">
              <option value="" disabled selected>Sort</option>
              <option value="NEW_TO_OLD">Newest First</option>
              <option value="OLD_TO_NEW">Oldest First</option>
              <option value="ELPHABATIZE">Alphabetize</option>
            </select>
            </div>
            <div class="movie-cards-container" id="movie-cards-container">
              <div class="movie-card">
                <template class="data-movie-template">
                  <div class="movie-title"></div>
                  <div class="movie-year"></div>
                  <div class="movie-imdb"></div>
                  <div class="movie-poster"></div>
                </template>
              </div>
            </div>
            <div class="movies"> 
              <i class="fas fa-spinner movies__loading--spinner"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <div class="row row__column">
        <a href="#">
          <figure class="footer__logo">
            <img src="assets/movie-mania-logo-2.jpg" class="footer__logo--img" alt="">
          </figure>
        </a>
        <div class="footer__list">
          <a href="#" class="footer__link">Home</a>
          <a class="footer__link">About</a>
          <a href="#features" class="footer__link--primary">Movies</a>
          <a class="footer__link">Contact</a>
        </div>
        <div class="footer__copyright">Copyright &copy; 2026 Movie Mania LLC</div>
      </div>
    </div>
  </footer>
</body>
<script src="index.js"></script>

</html>
